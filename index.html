<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vite to Next.js AST Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 min-h-screen">
  <div class="max-w-6xl mx-auto space-y-4">
    <h1 class="text-2xl font-bold">Vite + React to Next.js App Router Converter</h1>
    
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium mb-1">Vite TSX Input</label>
        <textarea id="input" class="w-full h-96 p-3 bg-slate-800 border border-slate-700 rounded font-mono text-xs focus:outline-none" placeholder="Paste Vite TSX code here..."></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Next.js TSX Output</label>
        <textarea id="output" readonly class="w-full h-96 p-3 bg-slate-800 border border-slate-700 rounded font-mono text-xs focus:outline-none" placeholder="Converted code will appear here..."></textarea>
      </div>
    </div>

    <button id="convert-btn" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 rounded font-bold text-sm">Convert Code</button>

    <div class="mt-6 p-4 bg-slate-800 rounded border border-slate-700">
      <h2 class="text-lg font-semibold text-amber-400 mb-2">Manual Refactoring Needed / Typo Warnings</h2>
      <ul id="warnings" class="list-disc list-inside text-sm text-slate-300 space-y-1">
        <li class="text-slate-500 italic">No warnings generated yet.</li>
      </ul>
    </div>
  </div>

  <script>
    document.getElementById('convert-btn').addEventListener('click', () => {
      const source = document.getElementById('input').value;
      if (!source.trim()) return;

      const warnings = [];
      let needsClientDirective = false;

      try {
        const traverse = Babel.packages.traverse.default || Babel.packages.traverse;
        const t = Babel.packages.types;

        const ast = Babel.packages.parser.parse(source, {
          sourceType: "module",
          plugins: ["typescript", "jsx"]
        });

        traverse(ast, {
          ImportDeclaration(path) {
            if (path.node.source.value === "react-router-dom") {
              let hasLink = false;
              let hasNavHooks = false;

              path.node.specifiers.forEach((spec) => {
                const importedName = spec.imported ? spec.imported.name : null;

                if (importedName === "Link") {
                  hasLink = true;
                } else if (importedName === "useLocation") {
                  hasNavHooks = true;
                  needsClientDirective = true;
                  path.scope.rename("useLocation", "usePathname");
                  path.scope.rename("location", "pathname");
                } else if (importedName === "useNavigate") {
                  hasNavHooks = true;
                  needsClientDirective = true;
                  path.scope.rename("useNavigate", "useRouter");
                  path.scope.rename("navigate", "router");
                } else if (importedName === "useParams") {
                  warnings.push("`useParams()` detected: Next.js page params should be accepted via page props ({ params }) in Server Components.");
                }
              });

              if (hasLink) {
                path.insertBefore(
                  t.importDeclaration(
                    [t.importDefaultSpecifier(t.identifier("Link"))],
                    t.stringLiteral("next/link")
                  )
                );
              }
              if (hasNavHooks) {
                path.insertBefore(
                  t.importDeclaration(
                    [
                      t.importSpecifier(t.identifier("usePathname"), t.identifier("usePathname")),
                      t.importSpecifier(t.identifier("useRouter"), t.identifier("useRouter"))
                    ],
                    t.stringLiteral("next/navigation")
                  )
                );
              }

              path.remove();
            }
          },

          MemberExpression(path) {
            if (
              t.isIdentifier(path.node.object, { name: "pathname" }) &&
              t.isIdentifier(path.node.property, { name: "pathname" })
            ) {
              path.replaceWith(t.identifier("pathname"));
            }
          },

          CallExpression(path) {
            const callee = path.node.callee;
            
            const clientHooks = ["useState", "useEffect", "useContext", "useReducer", "useCallback", "useMemo", "useRef"];
            if (t.isIdentifier(callee) && clientHooks.includes(callee.name)) {
              needsClientDirective = true;
            }

            if (t.isIdentifier(callee, { name: "router" })) {
              const arg = path.node.arguments[0];
              if (arg && arg.type === "UnaryExpression" && arg.operator === "-" && arg.argument.value === 1) {
                path.node.callee = t.memberExpression(t.identifier("router"), t.identifier("back"));
                path.node.arguments = [];
              } else {
                path.node.callee = t.memberExpression(t.identifier("router"), t.identifier("push"));
              }
            }
          },

          JSXAttribute(path) {
            if (path.node.name.name === "to" && path.parentPath.node.name?.name === "Link") {
              path.node.name.name = "href";
            }
          },

          StringLiteral(path) {
            if (path.node.value.includes("exsist")) {
              warnings.push("Typo detected in string literal: 'exsist' -> should be 'exist'.");
            }
          },
          JSXText(path) {
            if (path.node.value.includes("exsist")) {
              warnings.push("Typo detected in JSX text: 'exsist' -> should be 'exist'.");
            }
          }
        });

        let { code } = Babel.transformFromAst(ast, null, {
          presets: [],
          filename: 'file.tsx'
        });

        if (needsClientDirective) {
          code = `"use client";\n\n` + code;
        }

        document.getElementById('output').value = code;

        const warningsList = document.getElementById('warnings');
        warningsList.innerHTML = warnings.length > 0 
          ? warnings.map(w => `<li class="text-amber-300">${w}</li>`).join('')
          : '<li class="text-green-400">All detected features converted automatically!</li>';

      } catch (err) {
        alert("Parsing Error: " + err.message);
        console.error(err);
      }
    });
  </script>
</body>
</html>
